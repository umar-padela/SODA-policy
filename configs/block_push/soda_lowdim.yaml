# ============================================================
# Block Push — SODA lowdim (state observations, oracle labels, k=9)
# ============================================================

name: soda_lowdim

n_obs_steps: 2
n_action_steps: 8
horizon: null          # auto = longest segment in dataset
obs_as_global_cond: true

task:
  name: block_push_lowdim
  dataset:
    zarr_path: data/raw/block_push/block_push.zarr
    option_id_key: option_id_supervised
    val_ratio: 0.1
    seed: 42
    min_segment_len: 3
    num_workers: 4
    anchor_cut_last_n: 0

# U-Net architecture (mirrors k=9 pusht settings)
policy:
  kernel_size: 9
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]   # smaller than image (no ResNet encoder overhead)
  n_groups: 8
  obs_as_global_cond: true
  obs_as_local_cond: false
  pred_action_steps_only: false

low_policy:
  num_options: null          # inferred from zarr (4 for block push)
  option_embed_dim: 16       # small — state obs is compact
  termination_hidden_dim: 256

noise_scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  variance_type: fixed_small

train_low:
  device: cuda:0
  seed: 42
  num_workers: 4
  output_dir: null
  wandb_enabled: true
  wandb_project: soda-final-experiments
  wandb_run_name: null
  wandb_group: block_push_lowdim
  wandb_tags: [block_push, lowdim, k9, oracle_labels]
  use_ema: true
  run_readme: null
  num_epochs: 500
  batch_size: 256          # larger than image — state is cheap
  lr: 1.0e-4
  lr_warmup_epochs: 5
  lr_schedule_type: cosine
  weight_decay: 1.0e-6
  checkpoint_every: 50
  termination_loss_weight: 0.005
  termination_pos_weight: null   # auto
  all_anchors: true
  option_balance: none
  best_checkpoint_metric: loss_diffusion
