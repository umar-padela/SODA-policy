# ============================================================
# Experiment: E3 — Push-T unsupervised option discovery (LOVE)
# Config: π_low, k=5 U-Net, no β head training, 500 epochs, cosine LR
#
# Identical to configs/pusht/exp_k5_no_beta.yaml except:
#   task.dataset.option_id_key: option_id_unsupervised  (LOVE labels)
#   train_low.wandb_group: unsupervised_study
#   train_low.wandb_tags: [unsupervised_study, love, k5]
#
# LOVE may produce a different num_options than the supervised baseline (3).
# num_options: null → inferred from zarr at load time.
# π_high (unsupervised_high_starts_prev_opt.yaml) can be trained in parallel — uses ImageNet init, not π_low weights.
# ============================================================

name: unsupervised_k5_no_beta

# --- Shared DP layout ---
n_obs_steps: 2
n_action_steps: 8              # eval-only; not a training param
horizon: null                  # auto = longest option segment in zarr
past_action_visible: false
obs_as_global_cond: true

task:
  name: pusht_image
  env_runner:
    legacy_test: true
    test_start_seed: 100000
    max_steps: 300
    fps: 10
    crf: 22
    render_size: 96
    tqdm_interval_sec: 5.0
  dataset:
    zarr_path: data/raw/pusht/pusht.zarr
    option_id_key: option_id_unsupervised      # <-- LOVE labels (vs option_id_supervised in E1)
    val_ratio: 0.1
    seed: 42
    min_segment_len: 3         # drop 1- and 2-frame segments; keep ≥ 3
    num_workers: 8
    anchor_cut_last_n: 0       # π_low: unused (0 = no cut)

policy:
  kernel_size: 5               # matches exp_k5_no_beta.yaml (E1 kernel sweep baseline)
  crop_shape: [84, 84]
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  n_groups: 8
  cond_predict_scale: true
  eval_fixed_crop: true
  obs_encoder_group_norm: true

low_policy:
  num_options: null            # inferred from zarr
  option_embed_dim: 32
  bottleneck_dim: 2048         # must equal policy.down_dims[-1]
  termination_input: obs       # irrelevant (weight=0); set for completeness
  termination_stop_grad: true  # redundant with weight=0; belt-and-suspenders
  termination_label_smoothing: 0.05
  imagenet_init: true
  termination_head:
    bottleneck_dim: 2048
    hidden_dim: 256
    num_layers: 2
    use_chunk_cursor: false
    dropout_rate: 0.0          # β MLP not trained in this experiment

noise_scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  variance_type: fixed_small

train_low:
  # --- infrastructure ---
  device: cuda:0
  seed: 42
  num_workers: 4
  output_dir: null             # overridden by modal entrypoint
  wandb_enabled: true
  wandb_project: soda-final-experiments
  wandb_run_name: null
  wandb_group: unsupervised_study
  wandb_tags: [unsupervised_study, love, k5]
  use_ema: true
  run_readme: null

  # --- schedule: cosine LR (matches exp_k5_no_beta.yaml) ---
  num_epochs: 500
  batch_size: 64
  lr: 1.0e-4
  lr_warmup_epochs: 5          # linear ramp 0→lr over first 5 epochs
  lr_schedule_type: cosine     # warmup 5 epochs then cosine decay to 0 over remaining 495
  lr_plateau_patience: null
  lr_plateau_patience_beta: null
  lr_plateau_factor: null
  lr_plateau_min_lr: null
  weight_decay: 1.0e-6
  checkpoint_every: 50         # save epoch_NNNN.ckpt every 50 epochs for eval sweep

  # --- termination head: COMPLETELY DISABLED ---
  termination_loss_weight: 0.0
  termination_stop_grad: true
  termination_pos_weight: 1.0
  beta_lr: 1.0e-3
  beta_stratified_batches: false
  mask_diffusion_on_positive: false
  skip_diffusion_loss: false   # diffusion trains normally

  # --- data ---
  all_anchors: true
  option_balance: none         # no inverse-freq weighting on diffusion loss
  best_checkpoint_metric: loss_diffusion

  # --- warmstart ---
  finetune_dp_checkpoint: null
  warmstart_unet: null
  checkpoint: null

# --- Hierarchical eval (not used during training; high_checkpoint set at eval time) ---
inference:
  beta_transition: 0.9
  beta_diffusion_t: 0
  high_checkpoint: null        # set at eval time to unsupervised high policy checkpoint
  low_checkpoint: null

eval:
  wandb_enabled: true
  wandb_project: soda-final-experiments
  policy: soda
  record_video: true
  smoke:
    n_test: 5
  full:
    n_test: 50
