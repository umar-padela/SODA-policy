# π_high training config — unsupervised (LOVE) labels, segment-start observations, prev-option conditioning.
#
# Identical to configs/pusht/high_starts_prev_opt.yaml except:
#   task.dataset.option_id_key: option_id_unsupervised  (LOVE labels)
#   train_high.output_dir: /experiments/final_experiments/pusht/unsupervised_study/high
#   train_high.wandb_group: unsupervised_study
#   train_high.wandb_tags: [unsupervised_study, love, high]
#
# π_high uses a fresh ResNet (ImageNet init, imagenet_init: true) — not the π_low obs encoder.
# π_low and π_high can be trained in parallel; no ordering dependency.
# num_options is inferred from the zarr (LOVE may differ from the supervised baseline of 3).

name: unsupervised_high_starts_prev_opt

# --- Shared layout ---
n_obs_steps: 2
n_action_steps: 8
horizon: null
past_action_visible: false
obs_as_global_cond: true

task:
  name: pusht_image
  env_runner:
    legacy_test: true
    test_start_seed: 100000
    max_steps: 300
    fps: 10
    crf: 22
    render_size: 96
    tqdm_interval_sec: 5.0
  dataset:
    zarr_path: data/raw/pusht/pusht.zarr
    option_id_key: option_id_unsupervised      # <-- LOVE labels
    val_ratio: 0.1
    seed: 42
    min_segment_len: 5
    num_workers: 8
    anchor_cut_last_n: 8    # multi-anchor aug: train on all segment frames except last 8

# --- π_high architecture ---
high_policy:
  num_options: null
  global_feat_dim: null
  hidden_dim: 256
  num_layers: 2
  condition_on_prev_option: true
  prev_option_embed_dim: 32

# --- DP backbone architecture (obs encoder shared with π_low; not retrained here) ---
policy:
  crop_shape: [84, 84]
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5              # must match π_low backbone (unsupervised_k5_no_beta)
  n_groups: 8
  cond_predict_scale: true
  eval_fixed_crop: true
  obs_encoder_group_norm: true

noise_scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  variance_type: fixed_small

# --- π_high training ---
train_high:
  device: cuda:0
  seed: 42
  num_epochs: 50
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  lr_warmup_epochs: 5
  lr_schedule_type: cosine
  checkpoint_every: 5
  output_dir: /experiments/final_experiments/pusht/unsupervised_study/high
  wandb_enabled: true
  wandb_project: soda-train-high
  wandb_run_name: null
  wandb_group: unsupervised_study
  wandb_tags: [unsupervised_study, love, high]
  low_checkpoint: null      # not needed for weight init (imagenet_init: true); set dp_checkpoint for arch config
  dp_checkpoint: /experiments/dp_baselines/pusht_image_cnn_train0/latest.ckpt
  num_workers: 4
  option_balance: none
  use_ema: true
  lr_warmup_epochs: 5
  freeze_obs_encoder: false
  backbone_lr: 1.0e-4
  dropout_rate: 0.3
  label_smoothing: 0.1
  imagenet_init: true
  train_on_all_frames: false  # segment-start frames only (OptionStartDataset)

# --- Inference (fill after training) ---
inference:
  beta_transition: 0.9
  beta_diffusion_t: 0
  high_checkpoint: null
  low_checkpoint: null

eval:
  wandb_enabled: true
  wandb_project: soda-final-experiments
  policy: soda
  record_video: true
  smoke:
    n_test: 5
  full:
    n_test: 50
