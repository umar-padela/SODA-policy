# ============================================================
# Experiment: receding_horizon_study / kernel_size_study
# Run: kernel_size=5, no termination head training, 500 epochs, constant LR
# High policy (fixed, all experiments):
#   /experiments/final_experiments/pusht/high_study/high_starts_prev_opt/best.ckpt
#
# WHAT CHANGES vs other no-beta configs:
#   policy.kernel_size: 5  (this file)  |  7 (exp_k7)  |  9 (exp_k9)
# ============================================================

name: exp_k5_no_beta

# --- Shared DP layout ---
n_obs_steps: 2
n_action_steps: 8              # eval-only; not a training param
horizon: null                  # auto = longest option segment in zarr
past_action_visible: false
obs_as_global_cond: true

task:
  name: pusht_image
  env_runner:
    legacy_test: true
    test_start_seed: 100000
    max_steps: 300
    fps: 10
    crf: 22
    render_size: 96
    tqdm_interval_sec: 5.0
  dataset:
    zarr_path: data/raw/pusht/pusht.zarr
    option_id_key: option_id_supervised
    val_ratio: 0.1
    seed: 42
    min_segment_len: 3         # drop 1- and 2-frame segments; keep ≥ 3
    num_workers: 8
    anchor_cut_last_n: 0       # π_low: unused (0 = no cut)

# === WHAT CHANGES ===
policy:
  kernel_size: 5               # <-- VARIES ACROSS KERNEL_SIZE_STUDY: 5 | 7 | 9
  crop_shape: [84, 84]
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  n_groups: 8
  cond_predict_scale: true
  eval_fixed_crop: true
  obs_encoder_group_norm: true

# === CONSTANT ACROSS ALL EXPERIMENTS ===
low_policy:
  num_options: null            # inferred from zarr
  option_embed_dim: 32
  bottleneck_dim: 2048         # must equal policy.down_dims[-1]
  termination_input: obs       # irrelevant (weight=0); set for completeness
  termination_stop_grad: true  # redundant with weight=0; explicit for clarity
  termination_label_smoothing: 0.05
  imagenet_init: true          # load ImageNet conv weights into GroupNorm ResNet (matches base DP init)
  termination_head:
    bottleneck_dim: 2048
    hidden_dim: 256
    num_layers: 2
    use_chunk_cursor: false
    dropout_rate: 0.0        # beta MLP not trained in this experiment

noise_scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  variance_type: fixed_small

train_low:
  # --- infrastructure ---
  device: cuda:0
  seed: 42
  num_workers: 4
  output_dir: null             # overridden by modal entrypoint
  wandb_enabled: true
  wandb_project: soda-final-experiments
  wandb_run_name: null
  wandb_group: kernel_size_study
  wandb_tags: [kernel_size_study, k5]   # update tag in k7/k9 configs
  use_ema: true
  run_readme: null

  # --- single-phase training ---

  # --- schedule: constant LR, no decay ---
  num_epochs: 500
  batch_size: 64
  lr: 1.0e-4                   # matches Columbia DP; constant after warmup
  lr_warmup_epochs: 5          # linear ramp 0→lr over first 5 epochs
  lr_schedule_type: cosine     # warmup 5 epochs then cosine decay to 0 over remaining 495
  lr_plateau_patience: null
  lr_plateau_patience_beta: null
  lr_plateau_factor: null
  lr_plateau_min_lr: null
  weight_decay: 1.0e-6         # matches Columbia DP
  checkpoint_every: 50         # save epoch_NNNN.ckpt every 50 epochs for eval sweep

  # --- termination head: COMPLETELY DISABLED ---
  termination_loss_weight: 0.0  # zero → no β loss, no β gradient anywhere
  termination_stop_grad: true   # redundant with weight=0; belt-and-suspenders
  termination_pos_weight: 1.0   # irrelevant (weight=0)
  beta_lr: 1.0e-3               # β MLP optimizer exists but gradient is zero
  beta_stratified_batches: false
  mask_diffusion_on_positive: false
  skip_diffusion_loss: false    # diffusion trains normally

  # --- data ---
  all_anchors: true
  option_balance: none          # no inverse-freq weighting on diffusion loss
  best_checkpoint_metric: loss_diffusion

  # --- warmstart ---
  finetune_dp_checkpoint: null  # null = scratch (ImageNet ResNet via robomimic)
  warmstart_unet: null
  checkpoint: null              # null = no phase-to-phase loading (single phase)

# --- Hierarchical eval (not used during training) ---
inference:
  beta_transition: 0.9
  beta_diffusion_t: 0
  high_checkpoint: /experiments/final_experiments/pusht/high_study/high_starts_prev_opt/best.ckpt
  low_checkpoint: null          # set at eval time

eval:
  wandb_enabled: true
  wandb_project: soda-final-experiments
  policy: soda
  record_video: true
  smoke:
    n_test: 5
  full:
    n_test: 50
