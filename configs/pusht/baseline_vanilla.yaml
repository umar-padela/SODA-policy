# Frozen vanilla Diffusion Policy — Push-T image CNN, official Columbia weights (train_0).
# Eval runs on Modal via: modal run modal/modal_eval.py
#
# Checkpoints are NOT in git. See experiments/README.md and scripts/download_dp_pusht_checkpoint.sh

task: pusht
method: diffusion_policy_cnn_image
train_seed: train_0

checkpoint:
  url: https://diffusion-policy.cs.columbia.edu/data/experiments/image/pusht/diffusion_policy_cnn/train_0/checkpoints/latest.ckpt
  filename: latest.ckpt
  # Pass this path to modal_eval.py --checkpoint (after modal_download_dp.py)
  volume_path: /experiments/dp_baselines/pusht_image_cnn_train0/latest.ckpt

eval:
  regime: receding
  action_horizon: 1  # replan every step; use 8 for DP-paper receding baseline
  smoke:
    n_test: 5
    max_steps: 300
  full:
    n_test: 50
    max_steps: 300
