# Shared SODA config: train π_high, train π_low, and hierarchical eval (supervised option labels).
#
# Param tags: [train] [eval] [train+eval] — see configs/README.md
#
# Modal training order:
#   1. modal run modal/modal_train_low.py
#   2. modal run modal/modal_train_high.py \
#        --low-checkpoint /experiments/train_low/soda_supervised/best.ckpt
#   3. modal run modal/modal_eval.py --config configs/pusht/soda_supervised.yaml
#
# Local training (optional): output_dir null → experiments/train_low|high/{name}/
# Modal auto-sets train_*.output_dir to /experiments/... on the Volume.

name: soda_supervised  # experiment id; used in output dirs and eval run names

# --- Shared DP-style layout (both policies + env) ---
n_obs_steps: 2           # observation history length (frames fed to vision encoder)
n_action_steps: 8        # [eval] receding-horizon execute window before replan (h=8; not a training param)
horizon: null            # [train+eval] U-Net chunk length; null = auto (longest option segment in zarr)
past_action_visible: false  # [train+eval] Push-T: keep false (no past actions in obs)
obs_as_global_cond: true    # [train+eval] must stay true; false raises (inpainting not supported)

task:
  name: pusht_image      # task id (used if zarr_path omitted)
  env_runner:              # sim eval only (not used during training)
    legacy_test: true      # match Columbia Push-T test layout
    test_start_seed: 100000  # default env seed offset for test rollouts
    max_steps: 300         # episode step budget for overlap scoring (also used by modal eval)
    fps: 10                # video export framerate
    crf: 22                # video compression quality
    render_size: 96        # env render resolution (px)
    tqdm_interval_sec: 5.0 # progress bar update interval during eval
  dataset:                 # zarr + option segments (π_high and π_low training)
    zarr_path: data/raw/pusht/pusht.zarr  # demo data with option_id_* column
    option_id_key: option_id_supervised   # which label column (supervised heuristic)
    val_ratio: 0.1         # see reasoning below — SODA generates far fewer val examples per episode than DP
    seed: 42                 # split + sampling reproducibility
    min_segment_len: 5       # drop option segments shorter than this (steps)
    num_workers: 8         # match base DP
    anchor_cut_last_n: 8   # π_high multi-anchor aug: use all frames except last N per segment (0 = start only)

# --- π_high architecture (HighPolicy) — cross-entropy classifier ---
high_policy:
  num_options: null        # |unique option ids| in zarr; null = infer from dataset
  global_feat_dim: null    # obs encoder output dim; null = infer from frozen DP checkpoint
  hidden_dim: 256          # classifier MLP hidden size
  num_layers: 2            # classifier MLP depth
  condition_on_prev_option: false  # true → concatenate prev-option embedding to obs feat
  prev_option_embed_dim: 32        # dim of prev-option embedding (null token = num_options)

# --- π_low SODA-specific (LowPolicyConfig) ---
# β recipe: obs termination + two-phase training.
# Phase 1 (150 epochs): stop_grad=true → β head trains from frozen backbone features (no ResNet gradient).
#   Diffusion loss shapes the backbone; β learns to fire on stable, well-formed representations.
# Phase 2 (350 epochs): stop_grad=false → β gradients flow into obs encoder (joint fine-tuning).
#   λ=0.005 keeps β contribution ≈13% of total ResNet gradient (diffusion is restoring force).
#   Binary labels (last frame=1, rest=0) + label smoothing ε=0.05 prevent logit saturation.
#
# termination_loss_weight (λ), termination_pos_weight (γ), termination_stop_grad live in
# train_low phase blocks — they are training-time parameters, not model-architecture params.
low_policy:
  num_options: null        # must match π_high; null = infer from zarr
  option_embed_dim: 32     # concatenated to U-Net global_cond; small perturbation to DP architecture
  bottleneck_dim: 2048     # U-Net mid channels; must equal policy.down_dims[-1]
  termination_input: obs         # obs+ω encoding → β MLP (no second U-Net forward at inference)
  termination_stop_grad: true    # initial value; overridden per phase in train_low phase blocks
  termination_label_smoothing: 0.05  # ε: maps 0→0.05 and 1→0.95 (prevents logit saturation)
  termination_head:
    bottleneck_dim: 2048   # overridden by obs_termination_input_dim when termination_input=obs
    hidden_dim: 256        # β MLP hidden size
    num_layers: 2          # β MLP depth
    use_chunk_cursor: false # cursor removed: β learns termination from obs alone

# --- π_low DP hybrid backbone — match ``dp.yaml`` / upstream ``image_pusht_diffusion_policy_cnn.yaml`` ---
policy:
  crop_shape: [84, 84]     # Columbia Push-T hybrid crop (96×96 render → 84×84)
  num_inference_steps: 100 # DDPM denoising steps at inference
  diffusion_step_embed_dim: 128  # Columbia U-Net time embedding
  down_dims: [512, 1024, 2048]  # matches base DP Push-T; last value must equal low_policy.bottleneck_dim
  kernel_size: 9           # due to larger action chunk horizon, increased from 5
  n_groups: 8              # GroupNorm groups in U-Net
  cond_predict_scale: true # FiLM scale in conditional U-Net blocks
  eval_fixed_crop: true    # Columbia eval uses fixed crop
  obs_encoder_group_norm: true  # GroupNorm on ResNet vision backbone (Columbia)

# --- DDPM noise schedule (π_low training + inference) ---
noise_scheduler:
  num_train_timesteps: 100 # diffusion training timesteps
  beta_start: 0.0001       # noise schedule start
  beta_end: 0.02           # noise schedule end
  beta_schedule: squaredcos_cap_v2  # variance schedule shape
  clip_sample: true        # clip denoised samples to [-1, 1]
  prediction_type: epsilon # predict noise (standard DDPM)
  variance_type: fixed_small  # Columbia DDPMScheduler default

# --- π_high optimization (train_high.py reads this block only) ---
train_high:
  device: cuda:0
  seed: 42
  num_epochs: 1000
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  checkpoint_every: 5      # save epoch_* every N epochs (+ best/latest)
  output_dir: null         # null → experiments/train_high/{name}/ (Modal → /experiments/train_high/{name}/)
  wandb_enabled: true
  wandb_project: soda-train-high
  wandb_run_name: null     # optional; sweeps set e.g. lr1.00e-04
  wandb_group: null        # optional; sweeps set e.g. B4-lr-sweep
  wandb_tags: []           # optional; sweeps set e.g. [sweep, pi_high, B4]
  low_checkpoint: null     # REQUIRED for π_high: pass --low-checkpoint on modal_train_high.py (e.g. /experiments/pusht/train_low/soda_supervised/best.ckpt)
  dp_checkpoint: /experiments/dp_baselines/pusht_image_cnn_train0/latest.ckpt
  num_workers: 4
  option_balance: none           # none | inverse_freq — multi-anchor aug provides enough linear-push samples; weighting shifts decision boundary toward rare class
  use_ema: true                 # EMA of policy weights; eval/checkpoints use EMA (matches π_low)
  lr_warmup_epochs: 5          # linear ramp 0→lr; cosine decays over remaining (num_epochs - 5) epochs
  freeze_obs_encoder: false    # true → frozen ResNet; false → gradients flow into ResNet (risk: overfitting with ~1.3k segment-start samples)
  backbone_lr: 1.0e-4          # ResNet LR; matches MLP lr — ImageNet init needs full adaptation, no Push-T features to preserve
  dropout_rate: 0.3            # MLP dropout after each hidden Mish; slows memorisation, buys more useful epochs
  label_smoothing: 0.1         # CE label smoothing; prevents logit explosion on easy training examples
  imagenet_init: true          # true → ImageNet-only ResNet init (no Push-T fine-tuning); independent of DP training run

# --- π_low optimization (train_low.py reads this block only) ---
#
# Phase-specific params (num_epochs, lr, etc.) accept either:
#   scalar          → same value for every phase (or the only phase if two_phase: false)
#   [p1_val, p2_val] → different value per phase  (only valid when two_phase: true)
#
train_low:
  # ── Shared infra (single value; applies to all phases) ──────────────────────
  device: cuda:0
  seed: 42
  batch_size: 64                # match base DP
  weight_decay: 1.0e-6
  checkpoint_every: 10          # save epoch_NNNN.ckpt every N epochs (+ best/latest always)
  output_dir: null              # null → experiments/train_low/{name}/  (Modal auto-sets to Volume path)
  wandb_enabled: true
  wandb_project: soda-train-low
  wandb_run_name: null          # null → auto; sweeps override e.g. lr3.13e-04-p1
  wandb_group: null             # null → no group; sweeps override e.g. A4-lr-sweep
  wandb_tags: []                # optional list; sweeps override e.g. [sweep, pi_low]
  finetune_dp_checkpoint: null   # null = scratch train (ImageNet-pretrained ResNet only)
                                 # set to /experiments/dp_baselines/.../latest.ckpt to warmstart
  num_workers: 4
  option_balance: inverse_freq  # "none" | "inverse_freq" — per-skill loss weights by segment count
  use_ema: true                 # EMA policy weights for checkpoints (matches Columbia DP)
  lr_schedule_type: constant    # "constant": linear warmup → constant lr (matches Columbia DP effective
                                #   LR for epochs 0-500; their 3050-epoch cosine barely decays)
                                # "plateau":  ReduceLROnPlateau after warmup (epoch-count-independent)
                                # "cosine":   cosine decay tied to num_epochs
  lr_plateau_patience: null     # unused (lr_schedule_type: constant)
  lr_plateau_patience_beta: null # unused (lr_schedule_type: constant)
  lr_plateau_factor: null       # unused (lr_schedule_type: constant)
  lr_plateau_min_lr: null       # unused (lr_schedule_type: constant)
  beta_stratified_batches: false
  run_readme: null

  num_epochs: 500
  lr: 1.0e-4
  lr_warmup_epochs: 5
  beta_lr: 1.0e-3
  warmstart_unet: null
  termination_loss_weight: 0.005
  termination_pos_weight: null   # auto-calculated from data
  termination_stop_grad: false
  mask_diffusion_on_positive: false
  skip_diffusion_loss: false
  all_anchors: true
  best_checkpoint_metric: loss_termination
  checkpoint: null               # null = ImageNet init; set to SODA checkpoint path to warmstart

# --- Hierarchical eval (soda_runner / policy_loaders; not used during training) ---
# Set both checkpoint paths after training (Modal Volume). CLI flags override yaml.
inference:
  beta_transition: 0.9    # terminate option when sigmoid(β) >= this threshold; binary labels → 0.5 is natural decision boundary
  beta_diffusion_t: 0      # diffusion timestep for β head at rollout (0 = clean plan)
  high_checkpoint: /experiments/pusht/train_high/train_high_multianchor/best.ckpt
  low_checkpoint: /experiments/pusht/train_low/soda_supervised/phase2/best.ckpt  # placeholder — set after training

# --- Sim eval (modal_eval.py reads this block; train scripts ignore it) ---
eval:
  wandb_enabled: true
  wandb_project: soda-eval
  policy: soda  # hierarchical SODA eval (requires inference.* checkpoints)
  record_video: true  # save rollout MP4s under eval run media/
  smoke:  # default regime unless --full
    n_test: 5  # quick sanity episode count
  full:  # activated with --full
    n_test: 50  # full benchmark episode count
