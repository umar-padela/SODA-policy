# Push-T SODA config — LOVE / unsupervised option labels (E3).
#
# Param tags: [train] [eval] [train+eval] — see configs/README.md
#
# Modal training order:
#   1. modal run modal/modal_train_low.py --config-name soda_unsupervised
#   2. modal run modal/modal_train_high.py \
#        --config-name soda_unsupervised \
#        --low-checkpoint /experiments/train_low/soda_unsupervised/best.ckpt
#   3. modal run modal/modal_eval.py --config configs/pusht/soda_unsupervised.yaml
#
# Local training (optional): output_dir null → experiments/train_low|high/{name}/
# Modal auto-sets train_*.output_dir to /experiments/... on the Volume.

name: soda_unsupervised  # experiment id; used in output dirs and eval run names

# --- Shared DP-style layout (both policies + env) ---
n_obs_steps: 2  # observation history length (frames fed to vision encoder)
n_action_steps: 8  # [eval] receding-horizon execute window before replan (h=8; not a training param)
horizon: null  # [train+eval] U-Net chunk length; null = auto (longest option segment in zarr)
past_action_visible: false  # [train+eval] Push-T: keep false (no past actions in obs)
obs_as_global_cond: true  # [train+eval] must stay true; false raises (inpainting not supported)

task:
  name: pusht_image  # task id (used if zarr_path omitted)
  env_runner:  # sim eval only (not used during training)
    legacy_test: true  # match Columbia Push-T test layout
    test_start_seed: 100000  # default env seed offset for test rollouts
    max_steps: 300  # episode step budget for overlap scoring (also used by modal eval)
    fps: 10  # video export framerate
    crf: 22  # video compression quality
    render_size: 96  # env render resolution (px)
    tqdm_interval_sec: 5.0  # progress bar update interval during eval
  dataset:  # zarr + option segments (π_high and π_low training)
    zarr_path: data/raw/pusht/pusht.zarr  # demo data with option_id_* column
    option_id_key: option_id_unsupervised  # which label column (LOVE / unsupervised)
    val_ratio: 0.1  # fraction of episodes held out for validation
    seed: 42  # split + sampling reproducibility
    min_segment_len: 1  # drop option segments shorter than this (steps)
    num_workers: 4  # DataLoader workers

# --- π_high architecture (HighPolicy) ---
high_policy:
  num_options: null  # |unique option ids| in zarr; null = infer from dataset
  option_embed_dim: 32  # flow-matching target / embedding width
  global_feat_dim: null  # obs encoder output dim; null = infer from frozen checkpoint
  fm_hidden_dim: 256  # option velocity MLP hidden size
  fm_num_layers: 3  # velocity MLP depth
  time_embed_dim: 32  # sinusoidal FM time embedding dim
  num_inference_steps: 10  # Euler steps when sampling ω at inference

# --- π_low SODA-specific (LowPolicyConfig) ---
# Locked β recipe (Push-T): bottleneck + joint training, γ=1, λ=0.1 (same as soda_supervised.yaml).
low_policy:
  num_options: null  # must match π_high; null = infer from zarr
  option_embed_dim: 32  # concat to U-Net global_cond (match high_policy)
  bottleneck_dim: 2048  # U-Net mid channels; must equal policy.down_dims[-1] (Columbia)
  termination_loss_weight: 0.1  # λ on termination BCE (joint training; do not use 1.0 with stop_grad=false)
  termination_pos_weight: 1  # γ=1 — auto (~17) collapses β to always-1; keep 1 for this recipe
  termination_input: bottleneck  # U-Net t=0 pooled bottleneck → β MLP (obs-only was too weak)
  termination_stop_grad: false  # L_termination backprops into U-Net (t=0) + encoder (locked)
  termination_head:
    bottleneck_dim: 2048  # input dim when termination_input=bottleneck; auto when obs
    hidden_dim: 256  # β MLP hidden size
    num_layers: 2  # β MLP depth

# --- π_low DP hybrid backbone — match ``dp.yaml`` / Columbia ``image_pusht_diffusion_policy_cnn.yaml`` ---
policy:
  crop_shape: [84, 84]  # Columbia Push-T hybrid crop (96×96 render → 84×84)
  num_inference_steps: 100  # DDPM denoising steps at inference
  diffusion_step_embed_dim: 128  # Columbia U-Net time embedding
  down_dims: [512, 1024, 2048]  # Columbia U-Net channel pyramid (last = bottleneck_dim)
  kernel_size: 5  # 1D conv kernel in U-Net
  n_groups: 8  # GroupNorm groups in U-Net
  cond_predict_scale: true  # FiLM scale in conditional U-Net blocks
  eval_fixed_crop: true  # Columbia eval uses fixed crop
  obs_encoder_group_norm: true  # GroupNorm on ResNet vision backbone (Columbia)

# --- DDPM noise schedule (π_low training + inference) ---
noise_scheduler:
  num_train_timesteps: 100  # diffusion training timesteps
  beta_start: 0.0001  # noise schedule start
  beta_end: 0.02  # noise schedule end
  beta_schedule: squaredcos_cap_v2  # variance schedule shape
  clip_sample: true  # clip denoised samples to [-1, 1]
  prediction_type: epsilon  # predict noise (standard DDPM)
  variance_type: fixed_small  # Columbia DDPMScheduler default

# --- π_high optimization (train_high.py reads this block only) ---
train_high:
  device: cuda:0  # training device
  seed: 42  # RNG seed for training
  num_epochs: 100  # training epochs
  batch_size: 64  # batch size
  lr: 1.0e-4  # AdamW learning rate
  weight_decay: 1.0e-6  # AdamW weight decay
  checkpoint_every: 10  # save epoch_* every N epochs (+ best/latest)
  output_dir: null  # null → experiments/train_high/{name}/ (Modal → /experiments/train_high/{name}/)
  wandb_enabled: true  # log metrics to Weights & Biases
  wandb_project: soda-train-high  # W&B project name
  low_checkpoint: null  # REQUIRED for π_high: pass --low-checkpoint on modal_train_high.py
  dp_checkpoint: null  # fallback if low_checkpoint null: Columbia DP .ckpt for frozen ObsEncoder only
  num_workers: 4  # DataLoader workers (overrides task.dataset.num_workers if set here)
  option_balance: inverse_freq  # none | inverse_freq — train loss weights per skill segment count

# --- π_low optimization (train_low.py reads this block only) ---
train_low:
  device: cuda:0  # training device
  seed: 42  # RNG seed for training
  num_epochs: 100  # training epochs
  batch_size: 64  # batch size
  lr: 1.0e-4  # AdamW learning rate
  weight_decay: 1.0e-6  # AdamW weight decay
  checkpoint_every: 10  # save epoch_* every N epochs (+ best/latest)
  output_dir: null  # null → experiments/train_low/{name}/ (Modal → /experiments/train_low/{name}/)
  wandb_enabled: true  # log metrics to Weights & Biases
  wandb_project: soda-train-low  # W&B project name
  finetune_dp_checkpoint: null  # optional: warm-start π_low from vanilla DP weights
  num_workers: 4  # DataLoader workers
  option_balance: inverse_freq  # none | inverse_freq — train loss weights per skill segment count
  use_ema: true  # EMA of policy weights; eval/checkpoints use EMA (matches Columbia DP)
  lr_warmup_epochs: 5  # linear ramp 0→lr; cosine decays over remaining (num_epochs - 5) epochs
  beta_stratified_batches: true  # each train batch mixes beta=1 (segment end) + beta=0 (random anchor)
  beta_batch_pos_fraction: null  # null → 1/(gamma+1) from termination_pos_weight; not 1/gamma
  best_checkpoint_metric: loss  # val_loss = val_loss_diffusion + λ*val_loss_termination; with λ=0.1 and converged β, tracks both

# --- Hierarchical eval (soda_runner / policy_loaders; not used during training) ---
inference:
  beta_transition: 0.9  # terminate option when sigmoid(β) >= this threshold
  beta_diffusion_t: 0  # diffusion timestep for β head at rollout (0 = clean plan)
  high_checkpoint: null  # e.g. /experiments/train_high/soda_unsupervised/best.ckpt
  low_checkpoint: null  # e.g. /experiments/train_low/soda_unsupervised/best.ckpt

# --- Sim eval (modal_eval.py reads this block; train scripts ignore it) ---
eval:
  wandb_enabled: true
  wandb_project: soda-eval
  policy: soda  # hierarchical SODA eval (requires inference.* checkpoints)
  record_video: true  # save rollout MP4s under eval run media/
  smoke:  # default regime unless --full
    n_test: 5  # quick sanity episode count
  full:  # activated with --full
    n_test: 50  # full benchmark episode count
