# ============================================================
# Experiment: termination_study / stage1_bottleneck_source
# Run: BOTTLENECK_EXPERT_POSITIVE_NEGATIVE — β trained with escape relabeling (expand-all).
#   Training signal: expert actions at t=0 → UNet bottleneck (stop_grad=True)
#   Labels: completion (β=1 at last frame) + escape (β=1 for wrong-option examples)
#   Expand-all: each (seg, anchor) pair generates K samples (1 real + K-1 escape).
# Backbone frozen: only β MLP trains. 250 epochs (bottleneck_expert unfinished at 100).
#
# WHAT CHANGES vs exp_term_bottleneck_expert:
#   escape_relabeling: true  — adds K-1 wrong-option escape examples per anchor
#   num_epochs: 250          — bottleneck_expert had not converged at 100 epochs
#
# WHAT CHANGES vs exp_term_bottleneck_ddim_positive_negative:
#   termination_input: bottleneck (expert actions at t=0, not 5-step DDIM)
#
# pos_weight: null → auto-calculated for escape distribution
#   For K=3, L≈17: pos_frac = (1+(K-1)*L)/(K*L) = 35/51 ≈ 0.686 → pos_weight ≈ 0.46
# ============================================================

name: exp_term_bottleneck_expert_positive_negative

n_obs_steps: 2
n_action_steps: 8
horizon: null
past_action_visible: false
obs_as_global_cond: true

task:
  name: pusht_image
  env_runner:
    legacy_test: true
    test_start_seed: 100000
    max_steps: 300
    fps: 10
    crf: 22
    render_size: 96
    tqdm_interval_sec: 5.0
  dataset:
    zarr_path: data/raw/pusht/pusht.zarr
    option_id_key: option_id_supervised
    val_ratio: 0.1
    seed: 42
    min_segment_len: 3
    num_workers: 8
    anchor_cut_last_n: 0

policy:
  kernel_size: 9
  crop_shape: [84, 84]
  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  n_groups: 8
  cond_predict_scale: true
  eval_fixed_crop: true
  obs_encoder_group_norm: true

low_policy:
  num_options: null
  option_embed_dim: 32
  bottleneck_dim: 2048
  termination_input: bottleneck        # expert actions at t=0 (same as bottleneck_expert)
  termination_stop_grad: true          # frozen: β gradient does NOT reach backbone
  termination_label_smoothing: 0.05
  escape_relabeling: true              # enable wrong-option expand-all (K-1 escapes per anchor)
  termination_head:
    bottleneck_dim: 2048               # U-Net bottleneck dim (must equal down_dims[-1])
    hidden_dim: 256
    num_layers: 2
    use_chunk_cursor: false
    dropout_rate: 0.3

noise_scheduler:
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: true
  prediction_type: epsilon
  variance_type: fixed_small

train_low:
  device: cuda:0
  seed: 42
  num_workers: 4
  output_dir: null
  wandb_enabled: true
  wandb_project: soda-final-experiments
  wandb_run_name: null
  wandb_group: termination_study_stage1
  wandb_tags: [termination_study, stage1, bottleneck_expert_positive_negative, frozen]
  use_ema: true
  run_readme: null

  # --- schedule ---
  num_epochs: 250
  batch_size: 64
  lr: 1.0e-4                   # backbone LR (unused since skip_diffusion_loss=true)
  lr_warmup_epochs: 0
  lr_schedule_type: constant
  lr_plateau_patience: null
  lr_plateau_patience_beta: null
  lr_plateau_factor: null
  lr_plateau_min_lr: null
  weight_decay: 1.0e-6
  checkpoint_every: 10

  # --- termination: ACTIVE, backbone FROZEN ---
  termination_loss_weight: 1.0
  termination_stop_grad: true
  termination_pos_weight: null  # auto-calculated: ~0.46 for K=3, L≈17 with escape
  completion_weight: 68.0       # 2:1:1 ratio (natural:β-0:escape) — natural gets 50% of gradient.
                                # = 2*(K-1)*avg_len = 2*2*17. pos_weight already equalizes β-0≈escape.
                                # net per-example: β=0→1.0, escape β=1→0.46, natural β=1→31.3
  beta_lr: 1.0e-3
  skip_diffusion_loss: true
  beta_stratified_batches: false
  mask_diffusion_on_positive: false

  # --- data ---
  all_anchors: true             # required for escape_relabeling expand-all
  option_balance: none
  best_checkpoint_metric: loss_termination

  # --- checkpoint ---
  finetune_dp_checkpoint: null
  warmstart_unet: null
  checkpoint: /experiments/final_experiments/pusht/kernel_size_study/k9/epoch_0450.ckpt

inference:
  beta_transition: 0.92
  beta_diffusion_t: 0
  high_checkpoint: /experiments/final_experiments/pusht/high_study/high_starts_prev_opt/best.ckpt
  low_checkpoint: null

eval:
  wandb_enabled: true
  wandb_project: soda-final-experiments
  policy: soda
  record_video: true
  smoke:
    n_test: 5
  full:
    n_test: 50
