# Single local conda env for this repo (laptop).
#
#   conda env create -f environment.yml
#   conda activate soda
#
# Includes: Modal CLI, W&B, Push-T labeling pipeline (zarr, opencv, …).
# GPU training stack (PyTorch, mujoco, DP) runs on Modal — pin reference in
# environment.modal.yml and modal/modal_config.py.

name: soda
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.23.3
  - matplotlib=3.6.1
  - zarr=2.12.0
  - numcodecs=0.10.2
  - py-opencv=4.6.0
  - pip:
    - modal
    - wandb
